name: Release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write   # lets a v* tag create the release
  id-token: write   # signed proof of origin
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Version from Cargo.toml
        id: ver
        shell: bash
        run: echo "v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/boxlauncher.wxs -d Version=${{ steps.ver.outputs.v }} -arch x64 -o BoxLauncher-${{ steps.ver.outputs.v }}-x64.msi
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive target/release/boxlauncher.exe BoxLauncher-${{ steps.ver.outputs.v }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: files-windows
          path: |
            BoxLauncher-*.msi
            BoxLauncher-*.zip
  macos:
    runs-on: macos-latest      # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Build the app and zip it
        run: |
          bash scripts/bundle-mac.sh
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ditto -c -k --keepParent dist/BoxLauncher.app "BoxLauncher-$V-mac-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: files-macos
          path: BoxLauncher-*-mac-arm64.zip
  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && sha256sum BoxLauncher-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: files/BoxLauncher-*
      - uses: actions/upload-artifact@v4
        with: { name: BoxLauncher-all, path: files/* }
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --generate-notes
